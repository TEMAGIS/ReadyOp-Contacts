<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReadyOp Contacts</title>
  <!-- The ?v= query string busts the browser's cache on each deploy that
       changes styles.css/app.js — without it, a browser that already has
       an old copy cached can keep using it even after you've pushed new
       files, which looks like "my fix isn't showing up." Bump this value
       (e.g. to today's date) any time you redeploy changed CSS/JS. -->
  <link rel="stylesheet" href="styles.css?v=20260902y" />
</head>
<body>
  <!-- ════════════════════════════════════════════════════════════
       LOGIN SCREEN
       Shown until a valid ArcGIS token is obtained. The button kicks
       off the OAuth 2.0 authorization-code (PKCE) flow — see
       arcgis-auth.js.
       ════════════════════════════════════════════════════════════ -->
  <div id="sign-in-screen" role="dialog" aria-labelledby="login-title" hidden>
    <div class="login-card">
      <div class="login-brand">
        <svg class="tn-badge" viewBox="0 0 100 100" role="img" aria-label="Tennessee state logo">
          <rect x="0" y="0" width="100" height="84" fill="#D22730" />
          <rect x="0" y="84" width="100" height="5" fill="#ffffff" />
          <rect x="0" y="89" width="100" height="11" fill="#002868" />
          <text x="50" y="70" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs"
                font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74"
                fill="#ffffff">TN</text>
        </svg>
        <div>
          <div class="login-title" id="login-title">ReadyOp Contacts</div>
          <div class="login-sub">Sign in with your ArcGIS Online account to view and edit ReadyOp contacts.</div>
        </div>
      </div>
      <div id="login-error" class="login-error" role="alert"></div>
      <button id="sign-in-btn" class="login-btn login-btn-oauth" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="flex-shrink:0">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="8.5" cy="7" r="4" />
          <polyline points="17 11 19 13 23 9" />
        </svg>
        Sign in with ArcGIS Online
      </button>
      <a id="oauth-fallback" href="#" target="_blank" hidden class="login-meta-link">
        Sign-in didn't open? Open in a new tab
      </a>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-brand">
      <svg class="tn-badge tn-badge-sm" viewBox="0 0 100 100" role="img" aria-label="Tennessee state logo">
        <rect x="0" y="0" width="100" height="84" fill="#D22730" />
        <rect x="0" y="84" width="100" height="5" fill="#ffffff" />
        <rect x="0" y="89" width="100" height="11" fill="#002868" />
        <text x="50" y="70" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs"
              font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74"
              fill="#ffffff">TN</text>
      </svg>
      <h1>ReadyOp Contacts</h1>
    </div>
    <!-- Region/County live directly in the header now — this is a desktop
         app (embedded in an Experience Builder widget, never a phone
         screen), so there's no need for the mobile-style slide-up
         "Filter" drawer that used to hide them behind a button. -->
    <div class="topbar-filters" id="topbar-filters" hidden>
      <div class="topbar-filter-group">
        <span class="topbar-filter-label">Region</span>
        <div class="buf-row topbar-buf-row" id="region-pill-row" role="group" aria-label="Filter by region"></div>
      </div>
      <div class="topbar-filter-group">
        <span class="topbar-filter-label">County</span>
        <div class="combo topbar-combo" id="county-combo">
          <input
            type="text"
            id="county-input"
            class="combo-input"
            placeholder="All counties"
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="county-listbox"
            aria-autocomplete="list"
            aria-label="Filter by county"
          />
          <button type="button" id="county-clear" class="combo-clear" aria-label="Clear county filter" hidden>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
          </button>
          <ul id="county-listbox" class="combo-listbox" role="listbox" aria-label="Counties" hidden></ul>
        </div>
      </div>
    </div>
    <div class="topbar-right">
      <span id="user-label"></span>
      <button id="sign-out-btn" hidden>Sign out</button>
    </div>
  </header>

  <div id="status-bar" role="status" hidden></div>

  <main id="app-screen" class="app-layout" hidden>
    <section class="list-pane">
      <div class="search-wrap">
        <label for="search-input" class="sr-only">Search contacts</label>
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search-input" type="search" placeholder="Search by name, organization, county, tags…" autocomplete="off" aria-label="Search contacts" />
      </div>
      <div class="active-filters" id="active-filters" aria-label="Active filters" aria-live="polite"></div>
      <ul id="contact-list"></ul>
      <div class="list-footer">
        <span id="pager-info"></span>
      </div>
    </section>

    <section class="edit-pane">
      <p id="edit-empty-state">Select a contact to edit.</p>
      <div id="edit-panel" hidden>
        <button type="button" id="edit-back-btn" class="edit-back-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          Back to list
        </button>
        <form id="edit-form">
          <!-- Laid out to mirror ReadyOp's own "Modify Contact" dialog:
               two columns instead of one long stack. Public Contact and
               Save changes pair up in the top row, then General Info /
               Address, then Phones / Emails. -->
          <div class="form-columns">
            <!-- Sits first, constrained to the top-left grid cell (not
                 full-width — see styles.css) so it's the first thing seen
                 when opening a contact — not buried below the other
                 fields — with a bigger, more clickable checkbox since this
                 gets checked on a lot of contacts while scrolling through
                 the list. Save changes sits beside it in the top-right
                 cell, so both are visible together without scrolling. -->
            <fieldset class="form-col public-contact-fieldset">
              <legend>Public Contact</legend>
              <div class="public-contact-row">
                <div class="public-checkbox-field">
                  <span class="public-contact-field-title">Sharing</span>
                  <label class="checkbox-label public-checkbox" id="share-public-label">
                    <input type="checkbox" name="SharePublic" id="share-public-checkbox" />
                    Share with public
                  </label>
                </div>
                <label class="public-phone-field">Public Facing Phone Number
                  <input name="PublicPhone" id="public-phone-input" class="phone-mask" placeholder="(615) 555-1234" inputmode="tel" autocomplete="off" />
                </label>
              </div>
            </fieldset>

            <div class="form-actions">
              <button type="submit">Save changes</button>
            </div>

            <fieldset class="form-col">
              <legend>General Info</legend>
              <label>First name <input name="First" required maxlength="16" /></label>
              <label>Last name <input name="Last" /></label>
              <label>Organization <input name="Organization" /></label>
              <label>Title <input name="Title" /></label>
              <div class="field-group">
                <label for="tags-input">Tags</label>
                <div class="tag-input" id="tags-field">
                  <div class="tag-chips" id="tags-chips"></div>
                  <input type="text" id="tags-input" placeholder="Type to add a tag…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="tags-listbox" aria-autocomplete="list" />
                  <ul id="tags-listbox" class="combo-listbox tags-listbox" role="listbox" aria-label="Available tags" hidden></ul>
                </div>
                <input type="hidden" name="Tags" id="tags-hidden" />
              </div>
              <label>PIN <input name="PIN" /></label>
              <label>Fax <input name="Fax" /></label>
            </fieldset>
            <datalist id="county-datalist"></datalist>

            <!-- Renamed from "Other Information" — every address-related
                 field now lives together here, Region first (it's the
                 broadest/top-level grouping) followed by the street-level
                 fields, with Address itself moved up from General Info so
                 nothing address-related is split across two fieldsets. -->
            <fieldset class="form-col" id="address-fieldset">
              <legend>Address</legend>
              <label>County <input name="County" list="county-datalist" placeholder="e.g. Davidson" /></label>
              <label>Region
                <select name="Region" id="edit-region-select">
                  <option value="">—</option>
                </select>
              </label>
              <label>Address <input name="Address" /></label>
              <label>Address 2 <input name="Address2" /></label>
              <label>City <input name="City" /></label>
              <label>State <input name="State" maxlength="2" placeholder="TN" /></label>
              <label>Zip <input name="Zip" /></label>
            </fieldset>

            <!-- Phones/Emails share this same 2-column grid (instead of
                 stacking full-width below it) so the whole form fits in
                 view on a typical desktop without scrolling. -->
            <fieldset class="form-col">
            <legend>Phones</legend>
            <div class="repeat-group" id="phones-group">
              <div class="repeat-row" data-index="0">
                <input name="Phone_0_Number" class="phone-mask" placeholder="(615) 555-1234" inputmode="tel" />
                <select name="Phone_0_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Satellite">Satellite</option>
                  <option value="Work">Work</option>
                  <option value="Work Cell">Work Cell</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_0_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="1">
                <input name="Phone_1_Number" class="phone-mask" placeholder="(615) 555-1234" inputmode="tel" />
                <select name="Phone_1_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Satellite">Satellite</option>
                  <option value="Work">Work</option>
                  <option value="Work Cell">Work Cell</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_1_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="2">
                <input name="Phone_2_Number" class="phone-mask" placeholder="(615) 555-1234" inputmode="tel" />
                <select name="Phone_2_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Satellite">Satellite</option>
                  <option value="Work">Work</option>
                  <option value="Work Cell">Work Cell</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_2_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="3">
                <input name="Phone_3_Number" class="phone-mask" placeholder="(615) 555-1234" inputmode="tel" />
                <select name="Phone_3_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Satellite">Satellite</option>
                  <option value="Work">Work</option>
                  <option value="Work Cell">Work Cell</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_3_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="4">
                <input name="Phone_4_Number" class="phone-mask" placeholder="(615) 555-1234" inputmode="tel" />
                <select name="Phone_4_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Satellite">Satellite</option>
                  <option value="Work">Work</option>
                  <option value="Work Cell">Work Cell</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_4_Textable" /> Textable</label>
              </div>
            </div>
          </fieldset>

          <fieldset class="form-col">
            <legend>Emails</legend>
            <div class="repeat-group" id="emails-group">
              <div class="repeat-row" data-index="0">
                <input name="Email_0_Address" placeholder="Email" type="email" />
                <select name="Email_0_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="1">
                <input name="Email_1_Address" placeholder="Email" type="email" />
                <select name="Email_1_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="2">
                <input name="Email_2_Address" placeholder="Email" type="email" />
                <select name="Email_2_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="3">
                <input name="Email_3_Address" placeholder="Email" type="email" />
                <select name="Email_3_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="4">
                <input name="Email_4_Address" placeholder="Email" type="email" />
                <select name="Email_4_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
            </div>
          </fieldset>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="app.js?v=20260902y"></script>
</body>
</html>
