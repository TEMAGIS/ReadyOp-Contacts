<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReadyOp Contacts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ════════════════════════════════════════════════════════════
       LOGIN SCREEN
       Shown until a valid ArcGIS token is obtained. The button kicks
       off the OAuth 2.0 authorization-code (PKCE) flow — see
       arcgis-auth.js.
       ════════════════════════════════════════════════════════════ -->
  <div id="sign-in-screen" role="dialog" aria-labelledby="login-title" hidden>
    <div class="login-card">
      <div class="login-brand">
        <svg class="tn-badge" viewBox="0 0 100 100" role="img" aria-label="Tennessee state logo">
          <rect x="0" y="0" width="100" height="84" fill="#D22730" />
          <rect x="0" y="84" width="100" height="5" fill="#ffffff" />
          <rect x="0" y="89" width="100" height="11" fill="#002868" />
          <text x="50" y="70" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs"
                font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74"
                fill="#ffffff">TN</text>
        </svg>
        <div>
          <div class="login-title" id="login-title">ReadyOp Contacts</div>
          <div class="login-sub">Sign in with your ArcGIS Online account to view and edit ReadyOp contacts.</div>
        </div>
      </div>
      <div id="login-error" class="login-error" role="alert"></div>
      <button id="sign-in-btn" class="login-btn login-btn-oauth" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" style="flex-shrink:0">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="8.5" cy="7" r="4" />
          <polyline points="17 11 19 13 23 9" />
        </svg>
        Sign in with ArcGIS Online
      </button>
      <a id="oauth-fallback" href="#" target="_blank" hidden class="login-meta-link">
        Sign-in didn't open? Open in a new tab
      </a>
    </div>
  </div>

  <header class="topbar">
    <div class="topbar-brand">
      <svg class="tn-badge tn-badge-sm" viewBox="0 0 100 100" role="img" aria-label="Tennessee state logo">
        <rect x="0" y="0" width="100" height="84" fill="#D22730" />
        <rect x="0" y="84" width="100" height="5" fill="#ffffff" />
        <rect x="0" y="89" width="100" height="11" fill="#002868" />
        <text x="50" y="70" text-anchor="middle" textLength="86" lengthAdjust="spacingAndGlyphs"
              font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="74"
              fill="#ffffff">TN</text>
      </svg>
      <h1>ReadyOp Contacts</h1>
    </div>
    <div class="topbar-right">
      <span id="user-label"></span>
      <button id="sign-out-btn" hidden>Sign out</button>
    </div>
  </header>

  <div id="status-bar" role="status" hidden></div>

  <main id="app-screen" class="app-layout" hidden>
    <section class="list-pane">
      <form id="search-form" class="search-form">
        <input name="First" placeholder="First name" />
        <input name="Last" placeholder="Last name" />
        <input name="Organization" placeholder="Organization" />
        <input name="Tags" placeholder="Tags" />
        <button type="submit">Search</button>
      </form>
      <ul id="contact-list"></ul>
      <div class="list-footer">
        <span id="pager-info"></span>
        <button id="load-more-btn" type="button" hidden>Load more</button>
      </div>
    </section>

    <section class="edit-pane">
      <p id="edit-empty-state">Select a contact to edit.</p>
      <div id="edit-panel" hidden>
        <form id="edit-form">
          <fieldset>
            <legend>Identity</legend>
            <label>First name <input name="First" required maxlength="16" /></label>
            <label>Last name <input name="Last" /></label>
            <label>Organization <input name="Organization" /></label>
            <label>Title <input name="Title" /></label>
            <label>Tags <input name="Tags" placeholder="comma-separated" /></label>
          </fieldset>

          <fieldset>
            <legend>Phones</legend>
            <div class="repeat-group" id="phones-group">
              <div class="repeat-row" data-index="0">
                <input name="Phone_0_Number" placeholder="Phone" />
                <select name="Phone_0_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Work">Work</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_0_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="1">
                <input name="Phone_1_Number" placeholder="Phone" />
                <select name="Phone_1_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Work">Work</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_1_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="2">
                <input name="Phone_2_Number" placeholder="Phone" />
                <select name="Phone_2_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Work">Work</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_2_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="3">
                <input name="Phone_3_Number" placeholder="Phone" />
                <select name="Phone_3_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Work">Work</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_3_Textable" /> Textable</label>
              </div>
              <div class="repeat-row" data-index="4">
                <input name="Phone_4_Number" placeholder="Phone" />
                <select name="Phone_4_Type">
                  <option value="Cell">Cell</option>
                  <option value="Desk">Desk</option>
                  <option value="Home">Home</option>
                  <option value="Work">Work</option>
                </select>
                <label class="checkbox"><input type="checkbox" name="Phone_4_Textable" /> Textable</label>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend>Emails</legend>
            <div class="repeat-group" id="emails-group">
              <div class="repeat-row" data-index="0">
                <input name="Email_0_Address" placeholder="Email" type="email" />
                <select name="Email_0_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="1">
                <input name="Email_1_Address" placeholder="Email" type="email" />
                <select name="Email_1_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="2">
                <input name="Email_2_Address" placeholder="Email" type="email" />
                <select name="Email_2_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="3">
                <input name="Email_3_Address" placeholder="Email" type="email" />
                <select name="Email_3_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
              <div class="repeat-row" data-index="4">
                <input name="Email_4_Address" placeholder="Email" type="email" />
                <select name="Email_4_Type">
                  <option value="Work">Work</option>
                  <option value="Home">Home</option>
                </select>
              </div>
            </div>
          </fieldset>

          <div class="form-actions">
            <button type="submit">Save changes</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
